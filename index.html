<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Croquis : apprendre à dessiner le corps</title>
<style>
:root{--bg:#f2f5f8;--card:#fff;--ink:#16213e;--mute:#5b6784;--line:#3d7bff;--link:#2557c9;--grid:#dbe3ec;--hl:#ffd83d;--r:10px;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0f1626;--card:#172038;--ink:#e9eef9;--mute:#9aa7c4;--line:#6aa0ff;--link:#8fb6ff;--grid:#233152;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,.logo,b{font-family:Georgia,"Times New Roman",serif}
h1{font-size:clamp(1.6rem,5vw,2.3rem);line-height:1.15;margin:8px 0 10px}
h2{font-size:1.25rem;margin:0 0 6px}
a{color:var(--link)}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:2px solid var(--ink);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px}
.logo{font-size:1.5rem;font-weight:700;text-decoration:none;color:var(--ink)}
nav{display:flex;gap:6px}
nav a{padding:8px 11px;border-radius:99px;color:var(--ink);text-decoration:none;font-weight:600}
nav a[aria-current=page]{background:var(--ink);color:var(--bg)}
main{max-width:960px;margin:0 auto;padding:20px 16px 60px}
.lead{max-width:60ch;color:var(--mute);margin:0 0 18px}
.mute{color:var(--mute);margin:4px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{display:block;text-align:left;border:2px solid var(--ink);border-radius:var(--r);background:var(--card);padding:8px;color:var(--ink);text-decoration:none;font:inherit;cursor:pointer}
.tile:hover{border-color:var(--line)}
.tile svg,.tile img{width:100%;aspect-ratio:1;display:block;object-fit:cover}
.tile .c{display:none}
.tile b{display:block;margin-top:6px}
.done{color:var(--link);font-size:.85rem;font-weight:600}
.stage{border:2px solid var(--ink);border-radius:var(--r);background:var(--card);max-width:460px;margin:12px auto;overflow:hidden}
.stage svg{display:block;width:100%;height:auto}
.c{fill:none;stroke:var(--line);stroke-width:1.6;stroke-dasharray:4 3}
.k{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.f{fill:var(--ink)}
.steps,.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.row.l{justify-content:flex-start}
.dot{width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);background:transparent;color:var(--ink);font:700 1rem Georgia,serif;cursor:pointer}
.dot[aria-current=step]{background:var(--ink);color:var(--bg)}
.panel{border:2px solid var(--ink);border-radius:var(--r);background:var(--card);padding:16px;margin:16px 0}
.panel p{max-width:65ch;margin:6px 0}
.btn{font:inherit;font-weight:700;border:2px solid var(--ink);background:var(--hl);color:#16213e;padding:10px 16px;border-radius:var(--r);cursor:pointer}
.btn.alt{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.chip{font:inherit;border:2px solid var(--ink);background:transparent;color:var(--ink);padding:4px 12px;border-radius:99px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
:is(a,button,input,select,textarea):focus-visible{outline:3px solid var(--line);outline-offset:2px}
.me{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.av{width:84px;height:84px;border-radius:50%;border:2px solid var(--ink);object-fit:cover;background:var(--hl);display:grid;place-items:center;font:700 2rem Georgia,
