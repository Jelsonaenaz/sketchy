<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Croquis — apprends à dessiner le corps humain</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Croquis</h1>
  <nav class="chips"><button class="chip" id="t1" aria-pressed="true">Dessiner</button><button class="chip" id="t2" aria-pressed="false">Ma galerie</button></nav>
</header>

<main id="v1">
  <div class="chips" id="parts" aria-label="Partie du corps"></div>
  <div class="chips" id="angles" aria-label="Angle de vue"></div>
  <div class="studio">
    <div class="stage"><svg id="svg" viewBox="0 0 400 500" aria-hidden="true"></svg><canvas id="cv" width="800" height="1000" aria-label="Zone de dessin"></canvas></div>
    <div class="panel">
      <div class="steps">
        <button class="btn" id="pv" aria-label="Étape précédente">‹</button>
        <div><b id="sl"></b><p id="sh"></p></div>
        <button class="btn" id="nx" aria-label="Étape suivante">›</button>
      </div>
      <div class="row">
        <button class="chip" id="pen" aria-pressed="true">Crayon</button>
        <button class="chip" id="era" aria-pressed="false">Gomme</button>
        <span class="row" id="cols"></span>
      </div>
      <label>Épaisseur du trait<input id="sz" type="range" min="1" max="14" value="4"></label>
      <label>Visibilité du guide<input id="op" type="range" min="0" max="100" value="70"></label>
      <div class="row"><button class="btn" id="un">Annuler</button><button class="btn" id="cl">Effacer</button></div>
      <div class="row"><button class="btn pri" id="pub">Publier</button><button class="btn" id="png">Télécharger</button></div>
    </div>
  </div>
</main>

<main id="v2" hidden>
  <div class="me"><div class="av" id="av">?</div><div><input id="nm" placeholder="Ton pseudo" maxlength="24" aria-label="Pseudo"><small id="cnt"></small></div></div>
  <div class="chips" id="fl"></div>
  <div id="grid"></div>
</main>
<div id="ts" role="status"></div>

<script src="script.js"></script>
</body>
</html>
